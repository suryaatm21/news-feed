name: Daily Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '32 12 * * *'
    - cron: '32 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.4.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily snapshot
        env:
          # GitHub's scheduled workflows can start late; avoid skipping a whole day
          # because the runner began outside the intended publish minute window.
          ALLOW_OUTSIDE_WINDOW: '1'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run generate:daily

      - name: Detect generated changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- content data)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require configured commit email
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
        run: |
          if [[ -z "$GIT_COMMIT_EMAIL" ]]; then
            echo "Set repository variable GIT_COMMIT_EMAIL to an email already linked to your GitHub account."
            exit 1
          fi

      - name: Extract generated date
        if: steps.changes.outputs.has_changes == 'true'
        id: snapshot
        run: |
          echo "date=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('data/latest.json', 'utf8')).date)")" >> "$GITHUB_OUTPUT"

      - name: Commit daily snapshot
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GIT_COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
          GIT_COMMIT_NAME: ${{ vars.GIT_COMMIT_NAME }}
        run: |
          git config user.email "$GIT_COMMIT_EMAIL"
          git config user.name "${GIT_COMMIT_NAME:-${{ github.repository_owner }}}"
          git add content data
          git commit -m "chore(daily): ${{ steps.snapshot.outputs.date }} snapshot"
          git push

      # Bot-authored pushes from this workflow do not trigger the separate push-based
      # Pages workflow, so deploy directly when a new snapshot is generated.
      - name: Resolve site base path
        if: steps.changes.outputs.has_changes == 'true'
        id: base
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Configure Pages
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/deploy-pages@v4
